services:
  - type: web
    name: paypilot-ai
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm approve-builds core-js esbuild && pnpm install --frozen-lockfile=false && pnpm run build
    startCommand: pnpm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PAYPAL_ENVIRONMENT
        value: sandbox
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        value: sb
      - key: PAYPAL_CLIENT_ID
        value: sb
